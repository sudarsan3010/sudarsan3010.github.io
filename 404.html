<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Sudarsan Natarajan</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Schibsted Grotesk"; src: url("/assets/fonts/schibsted-grotesk-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-display: swap; }
    @font-face { font-family: "Instrument Sans"; src: url("/assets/fonts/instrument-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "JetBrains Mono"; src: url("/assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
      font-family: "Instrument Sans", system-ui, sans-serif; color: #e7f2f3;
      background: radial-gradient(900px 500px at 70% 0%, rgba(63,201,184,.16), transparent 60%), linear-gradient(180deg, #0a2340, #0b2644 55%, #061a2f); }
    .well { position: relative; width: 120px; height: 220px; margin: 0 auto 28px; border: 3px solid rgba(220,240,238,.8); border-top: 0; border-radius: 0 0 14px 14px; overflow: hidden; }
    .well::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14%; background: linear-gradient(180deg, #3fc9b8, #0e7b7b); animation: drop 3s ease-in-out infinite alternate; }
    .well span { position: absolute; left: -12px; right: -12px; top: 0; border-top: 2px dashed #3fc9b8; opacity: .5; }
    @keyframes drop { from { height: 18%; } to { height: 8%; } }
    p.code { font-family: "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #3fc9b8; font-size: .8rem; margin: 0 0 12px; }
    h1 { font-family: "Schibsted Grotesk", sans-serif; font-weight: 800; font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -.03em; margin: 0 0 12px; }
    p { color: #b9ccd8; max-width: 44ch; margin: 0 auto 28px; line-height: 1.6; }
    a { display: inline-block; padding: .85rem 1.4rem; border-radius: 999px; background: #3fc9b8; color: #0b2644; font-weight: 600; text-decoration: none; }
    a:hover { background: #6fdccf; }
  </style>
</head>
<body>
  <main>
    <div class="well" aria-hidden="true"><span></span></div>
    <p class="code">Error 404 · Well ran dry</p>
    <h1>This page has dropped below the water table.</h1>
    <p>The link may be old or mistyped. Let's pump you back up to the surface.</p>
    <a href="/">Back to the homepage</a>
  </main>
</body>
</html>
